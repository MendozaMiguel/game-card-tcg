spring:
  application:
    name: arcane-online-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arcane_online}
    username: ${SPRING_DATASOURCE_USERNAME:arcane}
    password: ${SPRING_DATASOURCE_PASSWORD:arcane_dev_password_change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt-secret: ${ARCANE_JWT_SECRET:dev-only-64-byte-arcane-hs512-secret-key-please-override-in-prod!!}
    jwt-expiration-seconds: 86400
    cookie-name: ARCANE_SESSION
    cookie-secure: ${ARCANE_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${ARCANE_ALLOWED_ORIGINS:http://localhost,http://localhost:4200}
