@let s = spec();

<div
  class="arcane-art-canvas relative h-full w-full overflow-hidden select-none"
  [attr.data-faction]="s.faction"
  [attr.data-effect]="s.effect"
  [style.background]="s.backdropGradient"
  aria-hidden="true">
  <div class="arcane-art-rays" [attr.data-faction]="s.faction"></div>

  <svg
    viewBox="0 0 240 135"
    preserveAspectRatio="xMidYMid slice"
    class="relative z-10 h-full w-full"
    aria-hidden="true">
    <defs>
      <radialGradient [attr.id]="'glow-' + uid" cx="50%" cy="46%" r="54%">
        <stop offset="0%" [attr.stop-color]="s.secondaryColor" stop-opacity="0.44" />
        <stop offset="48%" [attr.stop-color]="s.primaryColor" stop-opacity="0.22" />
        <stop offset="100%" stop-color="#060811" stop-opacity="0" />
      </radialGradient>
      <linearGradient [attr.id]="'body-' + uid" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" [attr.stop-color]="s.secondaryColor" stop-opacity="0.34" />
        <stop offset="48%" stop-color="#172038" />
        <stop offset="100%" stop-color="#070a14" />
      </linearGradient>
      <linearGradient [attr.id]="'rim-' + uid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" [attr.stop-color]="s.secondaryColor" />
        <stop offset="65%" [attr.stop-color]="s.primaryColor" />
        <stop offset="100%" stop-color="#8c621d" />
      </linearGradient>
    </defs>

    <!-- 1. Atmospheric Depth Backdrop & Yu-Gi-Oh! Arcane Summoning Circle -->
    <rect x="0" y="0" width="240" height="135" [attr.fill]="'url(#glow-' + uid + ')'" />

    @switch (s.faction) {
      @case ('FIRE') {
        <polygon points="-8,135 28,62 64,135" fill="#1b0d0e" opacity="0.88" />
        <polygon points="178,135 212,56 248,135" fill="#1b0d0e" opacity="0.88" />
        <path d="M0 112 Q60 94 120 108 T240 102 L240 135 L0 135 Z" fill="rgb(124 45 18 / 0.52)" />
        <path d="M0 124 Q80 112 160 121 T240 116 L240 135 L0 135 Z" fill="rgb(249 115 22 / 0.28)" />
      }
      @case ('ICE') {
        <polygon points="-4,135 30,54 66,135" fill="rgb(14 48 82 / 0.72)" stroke="rgb(125 211 252 / 0.25)" stroke-width="0.8" />
        <polygon points="174,135 210,48 244,135" fill="rgb(14 48 82 / 0.72)" stroke="rgb(125 211 252 / 0.25)" stroke-width="0.8" />
        <path d="M0 114 L48 104 L92 118 L150 104 L204 116 L240 106 L240 135 L0 135 Z" fill="rgb(12 74 110 / 0.58)" />
      }
      @case ('SHADOW') {
        <!-- Ruined Gothic Pillars & Fractured Abyssal Moon -->
        <rect x="14" y="8" width="16" height="127" fill="#0d0a18" stroke="rgb(168 85 247 / 0.22)" stroke-width="0.8" />
        <rect x="210" y="8" width="16" height="127" fill="#0d0a18" stroke="rgb(168 85 247 / 0.22)" stroke-width="0.8" />
        <path d="M30 22 Q120 -6 210 22" fill="none" stroke="rgb(168 85 247 / 0.2)" stroke-width="1.2" />
        <circle cx="120" cy="58" r="46" fill="rgb(22 10 42 / 0.72)" stroke="rgb(192 132 252 / 0.35)" stroke-width="1.2" />
        <path d="M0 110 C45 94 92 122 142 106 C184 94 212 118 240 104 L240 135 L0 135 Z" fill="rgb(59 7 100 / 0.56)" />
      }
      @case ('LIGHT') {
        <!-- Cathedral Lancet Arches & Volumetric God Rays -->
        <polygon points="120,0 24,135 64,135" fill="rgb(254 240 138 / 0.08)" />
        <polygon points="120,0 176,135 216,135" fill="rgb(254 240 138 / 0.08)" />
        <polygon points="120,0 92,135 148,135" fill="rgb(254 240 138 / 0.14)" />
        <path d="M18 135 V42 Q34 14 50 42 V135 M190 135 V42 Q206 14 222 42 V135" fill="rgb(15 20 38 / 0.65)" stroke="rgb(240 201 110 / 0.25)" stroke-width="0.9" />
        <path d="M0 114 Q120 98 240 114 L240 135 L0 135 Z" fill="rgb(133 77 14 / 0.36)" />
      }
    }

    <!-- Sacred Geometric Summoning Circle (Yu-Gi-Oh! Spellcaster Glyph Seal) -->
    <g opacity="0.56">
      <circle cx="120" cy="64" r="46" fill="none" [attr.stroke]="s.primaryColor" stroke-width="1" stroke-dasharray="5 3" />
      <circle cx="120" cy="64" r="39" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="0.85" />
      <polygon points="120,21 157,85 83,85" fill="none" [attr.stroke]="s.primaryColor" stroke-width="0.9" opacity="0.65" />
      <polygon points="120,107 157,43 83,43" fill="none" [attr.stroke]="s.primaryColor" stroke-width="0.9" opacity="0.65" />
    </g>

    <!-- 2. Detailed Multi-Tone Subject Artwork -->
    <g stroke-linecap="round" stroke-linejoin="round">
      @switch (s.subject) {
        @case ('dragon') {
          <!-- Majestic Winged Dragon / Sun Wyrm / Abyssal Hydra -->
          <path d="M116 64 L40 20 L60 50 L36 66 L76 74 L58 88 L104 82 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.8" />
          <path d="M124 64 L200 20 L180 50 L204 66 L164 74 L182 88 L136 82 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.8" />
          <path d="M120 66 L66 38 M120 68 L62 60 M120 66 L174 38 M120 68 L178 60" [attr.stroke]="s.secondaryColor" stroke-width="1" opacity="0.55" />
          <path d="M98 110 C84 96 86 78 106 72 L134 72 C154 78 156 96 142 110 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="s.primaryColor" stroke-width="1.6" />
          <path d="M120 22 L106 44 L86 24 L94 56 L112 90 L120 98 L128 90 L146 56 L154 24 L134 44 Z" fill="#0d1324" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <polygon points="120,30 112,50 120,86 128,50" [attr.fill]="s.primaryColor" opacity="0.28" />
          <polygon points="108,52 115,56 109,59" [attr.fill]="s.secondaryColor" />
          <polygon points="132,52 125,56 131,59" [attr.fill]="s.secondaryColor" />
          <path d="M112 72 L120 82 L128 72" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
        }
        @case ('phoenix') {
          <!-- Blazing Feathered Phoenix Crest & Ember Plume -->
          <path d="M114 64 C84 20 44 24 28 48 C54 54 68 68 88 74 C64 80 54 90 76 92 L114 78 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.9" />
          <path d="M126 64 C156 20 196 24 212 48 C186 54 172 68 152 74 C176 80 186 90 164 92 L126 78 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.9" />
          <path d="M120 16 L108 42 L114 68 L120 108 L126 68 L132 42 Z" fill="#141a30" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <path d="M106 86 Q120 122 134 86" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
          <polygon points="120,32 125,40 120,46 115,40" [attr.fill]="s.secondaryColor" />
        }
        @case ('griffin') {
          <!-- Solar / Shadow War Griffin with Feathered Armor Pinions -->
          <path d="M114 66 L44 20 L62 46 L42 60 L72 72 L106 78 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.8" />
          <path d="M126 66 L196 20 L178 46 L198 60 L168 72 L134 78 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.8" />
          <path d="M120 26 L104 48 L96 42 L106 86 L120 104 L134 86 L144 42 L136 48 Z" fill="#10172b" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <polygon points="114,48 126,48 120,62" [attr.fill]="s.secondaryColor" />
          <circle cx="112" cy="43" r="2.2" [attr.fill]="s.secondaryColor" />
          <circle cx="128" cy="43" r="2.2" [attr.fill]="s.secondaryColor" />
        }
        @case ('golem') {
          <!-- Towering Armored Rune Colossus -->
          <polygon points="62,108 72,56 96,36 144,36 168,56 178,108 152,114 88,114" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.2" />
          <polygon points="98,46 120,30 142,46 136,70 104,70" fill="#111a30" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
          <polygon points="68,62 92,48 96,86 72,94" fill="#0d1424" [attr.stroke]="s.primaryColor" stroke-width="1.5" />
          <polygon points="172,62 148,48 144,86 168,94" fill="#0d1424" [attr.stroke]="s.primaryColor" stroke-width="1.5" />
          <polygon points="120,76 134,90 120,104 106,90" [attr.fill]="s.secondaryColor" [attr.stroke]="s.primaryColor" stroke-width="1.6" />
          <line x1="110" y1="54" x2="117" y2="54" [attr.stroke]="s.secondaryColor" stroke-width="2.5" />
          <line x1="123" y1="54" x2="130" y2="54" [attr.stroke]="s.secondaryColor" stroke-width="2.5" />
        }
        @case ('guardian') {
          <!-- Solar Vanguard Paladin / Lion-Crest Knight -->
          <path d="M120 14 L120 116" stroke="#f8fafc" stroke-width="3" />
          <path d="M111 28 L120 12 L129 28" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
          <path d="M84 40 L120 26 L156 40 L150 86 L120 110 L90 86 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.2" />
          <path d="M98 48 L120 38 L142 48 L138 78 L120 96 L102 78 Z" fill="#0c1222" [attr.stroke]="s.secondaryColor" stroke-width="1.5" />
          <polygon points="120,50 128,66 120,82 112,66" [attr.fill]="s.secondaryColor" />
        }
        @case ('owl') {
          <!-- Watchful Astral Night Owl -->
          <path d="M76 58 C64 38 76 26 98 42 L120 28 L142 42 C164 26 176 38 164 58 L150 96 L120 108 L90 96 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <circle cx="106" cy="56" r="8" fill="#070a14" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
          <circle cx="134" cy="56" r="8" fill="#070a14" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
          <circle cx="106" cy="56" r="3" [attr.fill]="s.secondaryColor" />
          <circle cx="134" cy="56" r="3" [attr.fill]="s.secondaryColor" />
          <polygon points="116,66 124,66 120,76" [attr.fill]="s.primaryColor" />
        }
        @case ('serpent') {
          <!-- Sinuous Wyrm Serpent -->
          <path d="M62 102 C62 68 164 82 164 52 C164 30 108 24 94 42 C88 52 112 60 134 56" fill="none" [attr.stroke]="s.primaryColor" stroke-width="9" />
          <path d="M62 102 C62 68 164 82 164 52 C164 30 108 24 94 42 C88 52 112 60 134 56" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.4" />
          <polygon points="124,46 150,42 154,58 130,66" fill="#0c1222" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <circle cx="143" cy="52" r="2.2" [attr.fill]="s.secondaryColor" />
        }
        @case ('beast') {
          <!-- Prowling Arcane Feline / Ghost Wolf / Lion Familiar -->
          <path d="M84 78 Q66 64 58 84 Q70 98 92 94 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="s.primaryColor" stroke-width="1.6" />
          <path d="M86 50 L90 22 L110 40 L130 40 L150 22 L154 50 L146 88 L120 104 L94 88 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <path d="M96 48 L112 54 L102 64 Z M144 48 L128 54 L138 64 Z" [attr.fill]="s.secondaryColor" />
          <circle cx="105" cy="57" r="2" fill="#060811" />
          <circle cx="135" cy="57" r="2" fill="#060811" />
          <path d="M110 78 L120 86 L130 78 M102 74 L84 78 M138 74 L156 78" fill="none" [attr.stroke]="s.primaryColor" stroke-width="1.8" />
        }
        @case ('wisp') {
          <!-- Astral Fae / Shadow Imp / Winged Familiar with Radiant Core -->
          <path d="M112 62 C82 26 48 34 58 60 C46 80 80 96 112 72 Z" fill="rgb(255 255 255 / 0.1)" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.8" />
          <path d="M128 62 C158 26 192 34 182 60 C194 80 160 96 128 72 Z" fill="rgb(255 255 255 / 0.1)" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="1.8" />
          <path d="M120 34 C132 48 134 74 120 92 C106 74 108 48 120 34 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <circle cx="120" cy="62" r="9" [attr.fill]="s.primaryColor" opacity="0.88" />
          <circle cx="120" cy="62" r="4.5" [attr.fill]="s.secondaryColor" />
        }
        @case ('reaper') {
          <!-- Abyssal Demon / Void Lich / Reaper with Horned Mantle & Cursed Staff -->
          <path d="M98 32 L78 16 M142 32 L162 16" [attr.stroke]="s.secondaryColor" stroke-width="2.6" />
          <path d="M74 108 C76 62 90 32 120 24 C150 32 164 62 166 108 L142 96 L120 112 L98 96 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <path d="M104 52 Q120 38 136 52 Q130 74 120 78 Q110 74 104 52 Z" fill="#05070e" [attr.stroke]="s.secondaryColor" stroke-width="1.6" />
          <polygon points="109,54 117,57 111,60" [attr.fill]="s.secondaryColor" />
          <polygon points="131,54 123,57 129,60" [attr.fill]="s.secondaryColor" />
          <line x1="66" y1="22" x2="72" y2="114" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <circle cx="66" cy="22" r="6" [attr.fill]="s.secondaryColor" opacity="0.9" />
        }
        @case ('seraph') {
          <!-- Solar Archangel / Dawn Unicorn Crest & Celestial Pinions -->
          <circle cx="120" cy="26" r="11" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
          <path d="M114 58 L46 24 L60 54 L44 74 L98 84 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="s.secondaryColor" stroke-width="1.9" />
          <path d="M126 58 L194 24 L180 54 L196 74 L142 84 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="s.secondaryColor" stroke-width="1.9" />
          <path d="M120 32 L134 62 L120 106 L106 62 Z" fill="#10182e" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.2" />
          <polygon points="120,44 126,64 120,86 114,64" [attr.fill]="s.secondaryColor" opacity="0.85" />
        }
        @case ('campfire') {
          <!-- Sacred Healing Sanctuary Flame / Chalice -->
          <path d="M84 98 L156 98 M94 106 L146 106" stroke="#c8a44d" stroke-width="3.5" />
          <path d="M120 20 C142 48 148 78 120 94 C92 78 98 48 120 20 Z" [attr.fill]="s.glowColor" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.4" />
          <path d="M120 40 C134 58 134 78 120 90 C106 78 106 58 120 40 Z" [attr.fill]="s.secondaryColor" opacity="0.88" />
        }
        @case ('fireball') {
          <!-- Divine / Volcanic Arcane Judgment Starburst -->
          <polygon points="120,16 132,50 168,64 132,78 120,112 108,78 72,64 108,50" [attr.fill]="s.glowColor" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2" />
          <circle cx="120" cy="64" r="24" [attr.fill]="s.primaryColor" opacity="0.52" />
          <circle cx="120" cy="64" r="11" [attr.fill]="s.secondaryColor" />
        }
        @case ('vortex') {
          <!-- Swirling Elemental Tempest -->
          <path d="M78 40 C110 22 162 32 164 58 C166 86 92 88 88 64 C84 46 132 44 136 60" fill="none" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="3.2" />
          <path d="M66 68 C90 98 164 100 174 68" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.2" stroke-dasharray="6 4" />
        }
        @case ('chains') {
          <!-- Locking Runic Prism + Crossed Links -->
          <polygon points="120,24 152,64 120,104 88,64" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.4" />
          <line x1="64" y1="34" x2="176" y2="94" [attr.stroke]="s.secondaryColor" stroke-width="3.2" stroke-dasharray="10 5" />
          <line x1="176" y1="34" x2="64" y2="94" [attr.stroke]="s.secondaryColor" stroke-width="3.2" stroke-dasharray="10 5" />
        }
        @case ('shield') {
          <!-- Sacred Bastion Aegis Shield -->
          <path d="M82 32 L120 18 L158 32 L152 82 L120 108 L88 82 Z" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.6" />
          <path d="M96 42 L120 31 L144 42 L140 76 L120 95 L100 76 Z" [attr.fill]="s.glowColor" [attr.stroke]="s.secondaryColor" stroke-width="1.6" />
          <polygon points="120,46 131,63 120,80 109,63" [attr.fill]="s.secondaryColor" opacity="0.88" />
        }
        @case ('blade') {
          <!-- Celestial Runic Greatsword Descending with Radiant Shockwave -->
          <polygon points="120,12 132,76 120,112 108,76" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.2" />
          <path d="M88 76 L112 70 L128 70 L152 76 L128 82 L112 82 Z" [attr.fill]="s.primaryColor" [attr.stroke]="s.secondaryColor" stroke-width="1.4" />
          <line x1="120" y1="18" x2="120" y2="98" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
          <ellipse cx="120" cy="108" rx="44" ry="8" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.6" opacity="0.65" />
        }
        @case ('eclipse') {
          <!-- Occult Eclipsed Crescent & Hex Halo -->
          <circle cx="120" cy="64" r="30" [attr.fill]="s.primaryColor" opacity="0.34" />
          <circle cx="120" cy="64" r="27" fill="none" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.5" />
          <circle cx="128" cy="58" r="22" fill="#070812" />
          <polygon points="120,24 156,86 84,86" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.5" opacity="0.72" />
        }
        @case ('siphon') {
          <!-- Spectral Claw & Twin Life-Streams -->
          <path d="M80 98 C92 68 106 58 120 48 C134 58 148 68 160 98" fill="none" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="3.2" />
          <path d="M70 40 C94 46 108 66 120 66 C132 66 146 46 170 40" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.4" stroke-dasharray="5 3" />
          <circle cx="120" cy="64" r="12" fill="#0b0e18" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
        }
        @default {
          <!-- Runic Star Seal -->
          <polygon points="120,20 156,64 120,108 84,64" [attr.fill]="'url(#body-' + uid + ')'" [attr.stroke]="'url(#rim-' + uid + ')'" stroke-width="2.4" />
          <circle cx="120" cy="64" r="15" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" />
        }
      }
    </g>

    <!-- 3. Effect Visual Layer ("par rapport a la description") -->
    <g stroke-linecap="round" stroke-linejoin="round" pointer-events="none">
      @switch (s.effect) {
        @case ('SHIELD') {
          <path d="M54 98 C60 40 94 20 120 20 C146 20 180 40 186 98" fill="none" stroke="#7dd3fc" stroke-width="2.2" opacity="0.72" />
          <path d="M66 98 C72 52 98 32 120 32 C142 32 168 52 174 98" fill="none" stroke="#fef08a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.72" />
        }
        @case ('DAMAGE') {
          <path d="M48 106 Q120 50 196 26" fill="none" stroke="#fb7185" stroke-width="3.6" opacity="0.9" />
          <path d="M62 110 Q128 62 200 36" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.8" opacity="0.82" />
          <path d="M168 24 L182 32 M176 20 L174 36" stroke="#fde047" stroke-width="2" />
        }
        @case ('DESTROY') {
          <line x1="64" y1="22" x2="176" y2="106" stroke="#fb7185" stroke-width="3.2" opacity="0.9" />
          <line x1="176" y1="22" x2="64" y2="106" stroke="#f97316" stroke-width="2.4" opacity="0.82" />
        }
        @case ('ATK_BUFF') {
          <g class="arcane-art-float-slow">
            <path d="M48 88 L60 74 L72 88 M48 74 L60 60 L72 74" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.6" />
            <path d="M168 88 L180 74 L192 88 M168 74 L180 60 L192 74" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.6" />
          </g>
        }
        @case ('HEAL') {
          <g class="arcane-art-float-slow" stroke="#34d399">
            <path d="M50 64 L50 76 M44 70 L56 70" stroke-width="2.6" />
            <path d="M190 52 L190 64 M184 58 L196 58" stroke-width="2.6" />
            <circle cx="60" cy="40" r="3" fill="#34d399" stroke="none" opacity="0.75" />
            <circle cx="180" cy="84" r="3" fill="#fef08a" stroke="none" opacity="0.75" />
          </g>
        }
        @case ('SLOW') {
          <line x1="54" y1="42" x2="186" y2="42" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="8 6" opacity="0.78" />
          <line x1="54" y1="88" x2="186" y2="88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.78" />
        }
        @case ('STEALTH') {
          <path d="M36 78 Q88 54 134 72 T208 66" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.48" />
          <path d="M28 94 Q92 70 144 86 T216 80" fill="none" stroke="#94a3b8" stroke-width="2.5" opacity="0.4" />
        }
        @case ('ENERGY') {
          <polygon points="182,22 168,50 180,50 166,80 194,44 181,44" fill="#f0c96e" stroke="#fef08a" stroke-width="1.2" />
        }
        @case ('PEEK') {
          <ellipse cx="186" cy="40" rx="14" ry="8" fill="#080c17" stroke="#7dd3fc" stroke-width="1.8" />
          <circle cx="186" cy="40" r="3.5" fill="#fde047" />
        }
        @case ('REACTIVE') {
          <polygon points="120,14 125,24 115,24" fill="#f0c96e" />
          <polygon points="120,114 125,104 115,104" fill="#f0c96e" />
        }
        @case ('CURSE') {
          <path d="M52 38 L52 60 M46 54 L52 62 L58 54" fill="none" stroke="#fb7185" stroke-width="2.2" />
          <path d="M188 38 L188 60 M182 54 L188 62 L194 54" fill="none" stroke="#fb7185" stroke-width="2.2" />
        }
        @case ('SURVOL') {
          <path d="M34 42 Q98 16 164 28" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" stroke-dasharray="12 5" opacity="0.78" />
        }
      }
    </g>
  </svg>

  @if (!compact()) {
