@let s = spec();

<div
  class="arcane-art-canvas relative h-full w-full overflow-hidden select-none"
  [attr.data-faction]="s.faction"
  [attr.data-effect]="s.effect"
  [style.background]="s.backdropGradient"
  aria-hidden="true">
  <!-- Subtle ambient elemental particles / rays (CSS GPU transform/opacity under reduced-motion guard) -->
  <div class="arcane-art-rays" [attr.data-faction]="s.faction"></div>

  <svg
    viewBox="0 0 240 135"
    preserveAspectRatio="xMidYMid slice"
    class="relative z-10 h-full w-full"
    aria-hidden="true">
    <!-- 1. Elemental Horizon / Ground Atmosphere -->
    @switch (s.faction) {
      @case ('FIRE') {
        <path d="M0 112 Q60 96 120 108 T240 102 L240 135 L0 135 Z" fill="rgb(124 45 18 / 0.45)" />
        <path d="M0 124 Q80 112 160 121 T240 116 L240 135 L0 135 Z" fill="rgb(249 115 22 / 0.22)" />
        <g class="arcane-art-float-slow">
          <circle cx="38" cy="96" r="2.2" [attr.fill]="s.secondaryColor" opacity="0.7" />
          <circle cx="198" cy="84" r="1.8" [attr.fill]="s.primaryColor" opacity="0.8" />
          <circle cx="72" cy="34" r="1.5" [attr.fill]="s.secondaryColor" opacity="0.65" />
          <circle cx="176" cy="40" r="2" [attr.fill]="s.primaryColor" opacity="0.7" />
        </g>
      }
      @case ('ICE') {
        <polygon points="0,135 28,88 54,135" fill="rgb(56 189 248 / 0.16)" />
        <polygon points="186,135 212,82 240,135" fill="rgb(56 189 248 / 0.16)" />
        <path d="M0 114 L48 106 L92 118 L150 106 L204 116 L240 108 L240 135 L0 135 Z" fill="rgb(12 74 110 / 0.48)" />
        <g class="arcane-art-float-slow" [attr.stroke]="s.secondaryColor" stroke-width="1.2" opacity="0.55">
          <path d="M40 32 L40 42 M35 37 L45 37" />
          <path d="M202 44 L202 54 M197 49 L207 49" />
          <circle cx="84" cy="24" r="1.5" fill="currentColor" stroke="none" />
        </g>
      }
      @case ('SHADOW') {
        <circle cx="120" cy="56" r="36" fill="rgb(15 7 28 / 0.65)" stroke="rgb(168 85 247 / 0.35)" stroke-width="1.5" />
        <path d="M0 112 C45 98 92 122 142 108 C184 96 212 118 240 106 L240 135 L0 135 Z" fill="rgb(59 7 100 / 0.45)" />
        <g class="arcane-art-float-slow">
          <circle cx="44" cy="52" r="2" fill="#c084fc" opacity="0.65" />
          <circle cx="196" cy="60" r="1.8" fill="#fb7185" opacity="0.55" />
        </g>
      }
      @case ('LIGHT') {
        <path d="M120 8 L64 135 M120 8 L96 135 M120 8 L144 135 M120 8 L176 135" [attr.stroke]="s.secondaryColor" stroke-width="1" opacity="0.18" />
        <circle cx="120" cy="58" r="38" fill="none" stroke="rgb(254 240 138 / 0.28)" stroke-width="1.4" stroke-dasharray="4 4" />
        <path d="M0 114 Q120 100 240 114 L240 135 L0 135 Z" fill="rgb(133 77 14 / 0.28)" />
      }
    }

    <!-- 2. Subject Silhouette / Centerpiece -->
    <g stroke-linecap="round" stroke-linejoin="round">
      @switch (s.subject) {
        @case ('dragon') {
          <!-- Draconic Winged Crest & Horned Head -->
          <path d="M120 68 L62 28 L76 62 L52 72 L96 84 Z" fill="rgb(10 14 26 / 0.82)" [attr.stroke]="s.primaryColor" stroke-width="2" />
          <path d="M120 68 L178 28 L164 62 L188 72 L144 84 Z" fill="rgb(10 14 26 / 0.82)" [attr.stroke]="s.primaryColor" stroke-width="2" />
          <path d="M120 26 L104 48 L92 32 L98 62 L120 96 L142 62 L148 32 L136 48 Z" fill="rgb(16 22 38 / 0.94)" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
          <circle cx="111" cy="56" r="2.6" [attr.fill]="s.secondaryColor" />
          <circle cx="129" cy="56" r="2.6" [attr.fill]="s.secondaryColor" />
          <path d="M108 74 L120 84 L132 74" fill="none" [attr.stroke]="s.primaryColor" stroke-width="2" />
        }
        @case ('phoenix') {
          <!-- Soaring Winged Crest -->
          <path d="M120 58 C95 30 62 34 46 50 C68 58 84 68 102 74 Z" fill="rgb(16 22 38 / 0.88)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          <path d="M120 58 C145 30 178 34 194 50 C172 58 156 68 138 74 Z" fill="rgb(16 22 38 / 0.88)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          <path d="M120 22 L109 50 L120 98 L131 50 Z" fill="rgb(16 22 38 / 0.95)" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
          <path d="M110 88 L120 112 L130 88" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" />
        }
        @case ('griffin') {
          <!-- Swept Raptor Wings & Crest -->
          <path d="M120 64 L54 24 L68 50 L50 64 L96 76 Z" fill="rgb(16 22 38 / 0.86)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <path d="M120 64 L186 24 L172 50 L190 64 L144 76 Z" fill="rgb(16 22 38 / 0.86)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <path d="M120 32 L106 54 L120 94 L134 54 Z" fill="rgb(12 18 32 / 0.96)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          <path d="M115 48 L120 56 L125 48" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" />
        }
        @case ('golem') {
          <!-- Monolithic Shoulders & Rune Core -->
          <polygon points="74,98 84,48 104,34 136,34 156,48 166,98 144,104 96,104" fill="rgb(12 18 30 / 0.92)" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <polygon points="104,48 120,38 136,48 132,68 108,68" fill="rgb(22 32 52 / 0.95)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <polygon points="120,74 130,85 120,96 110,85" [attr.fill]="s.primaryColor" [attr.stroke]="s.secondaryColor" stroke-width="1.5" />
          <line x1="112" y1="54" x2="117" y2="54" [attr.stroke]="s.secondaryColor" stroke-width="2.5" />
          <line x1="123" y1="54" x2="128" y2="54" [attr.stroke]="s.secondaryColor" stroke-width="2.5" />
        }
        @case ('guardian') {
          <!-- Crested Vanguard Blade + Tower Shield -->
          <path d="M120 20 L120 106" stroke="#f4efe6" stroke-width="2.6" />
          <path d="M113 30 L120 18 L127 30" fill="none" stroke="#f4efe6" stroke-width="2.2" />
          <path d="M90 40 L120 30 L150 40 L146 82 L120 102 L94 82 Z" fill="rgb(12 18 32 / 0.9)" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <path d="M104 52 L120 44 L136 52 L133 76 L120 88 L107 76 Z" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.6" />
        }
        @case ('owl') {
          <!-- Watchful Night Owl & Sight Beam -->
          <path d="M84 44 L120 30 L156 44 L148 86 L120 98 L92 86 Z" fill="rgb(14 19 34 / 0.92)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          <circle cx="107" cy="56" r="7" fill="rgb(6 10 20)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <circle cx="133" cy="56" r="7" fill="rgb(6 10 20)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <circle cx="107" cy="56" r="2.5" [attr.fill]="s.secondaryColor" />
          <circle cx="133" cy="56" r="2.5" [attr.fill]="s.secondaryColor" />
          <polygon points="116,64 124,64 120,72" [attr.fill]="s.primaryColor" />
        }
        @case ('serpent') {
          <!-- Sinuous Coiled Serpent & Fangs -->
          <path d="M72 92 C72 64 156 76 156 50 C156 32 108 26 96 42 C90 50 112 58 130 56" fill="none" [attr.stroke]="s.primaryColor" stroke-width="7" />
          <path d="M72 92 C72 64 156 76 156 50 C156 32 108 26 96 42 C90 50 112 58 130 56" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <polygon points="124,48 144,44 148,56 130,64" fill="rgb(14 19 34 / 0.95)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <circle cx="139" cy="52" r="2" [attr.fill]="s.secondaryColor" />
        }
        @case ('beast') {
          <!-- Prowling Feral Mask & Claws -->
          <path d="M88 46 L94 26 L112 42 L128 42 L146 26 L152 46 L146 84 L120 98 L94 84 Z" fill="rgb(14 19 34 / 0.92)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          <path d="M102 60 L112 64 M138 60 L128 64" [attr.stroke]="s.secondaryColor" stroke-width="2.6" />
          <path d="M110 78 L120 84 L130 78" fill="none" [attr.stroke]="s.primaryColor" stroke-width="2" />
        }
        @case ('wisp') {
          <!-- Radiant Spirit Core with Ethereal Wings -->
          <path d="M112 62 C90 36 68 42 74 62 C64 74 86 86 112 72 Z" fill="rgb(255 255 255 / 0.08)" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
          <path d="M128 62 C150 36 172 42 166 62 C176 74 154 86 128 72 Z" fill="rgb(255 255 255 / 0.08)" [attr.stroke]="s.secondaryColor" stroke-width="1.8" />
          <circle cx="120" cy="64" r="14" fill="rgb(12 18 32 / 0.9)" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <circle cx="120" cy="64" r="6" [attr.fill]="s.secondaryColor" />
        }
        @case ('reaper') {
          <!-- Hooded Shadow / Spectral Mantle -->
          <path d="M86 102 C88 64 96 34 120 26 C144 34 152 64 154 102 L134 92 L120 104 L106 92 Z" fill="rgb(10 12 22 / 0.95)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          <path d="M106 54 Q120 42 134 54 Q128 72 120 74 Q112 72 106 54 Z" fill="#060811" [attr.stroke]="s.secondaryColor" stroke-width="1.5" />
          <circle cx="114" cy="56" r="2.3" [attr.fill]="s.secondaryColor" />
          <circle cx="126" cy="56" r="2.3" [attr.fill]="s.secondaryColor" />
        }
        @case ('seraph') {
          <!-- Haloed Astral Wings & Crest -->
          <circle cx="120" cy="30" r="10" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
          <path d="M120 56 L66 32 L74 58 L62 74 L106 80 Z" fill="rgb(254 240 138 / 0.14)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <path d="M120 56 L174 32 L166 58 L178 74 L134 80 Z" fill="rgb(254 240 138 / 0.14)" [attr.stroke]="s.secondaryColor" stroke-width="2" />
          <polygon points="120,40 132,68 120,98 108,68" fill="rgb(16 22 38 / 0.92)" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
        }
        @case ('campfire') {
          <!-- Restorative Brazier / Sacred Hearth -->
          <path d="M90 96 L150 96 M98 104 L142 104" stroke="#8c621d" stroke-width="3.5" />
          <path d="M120 26 C138 48 144 74 120 90 C96 74 102 48 120 26 Z" [attr.fill]="s.glowColor" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <path d="M120 44 C130 58 132 76 120 86 C108 76 110 58 120 44 Z" [attr.fill]="s.secondaryColor" opacity="0.85" />
        }
        @case ('fireball') {
          <!-- Concentric Elemental Detonation Sphere -->
          <circle cx="120" cy="64" r="30" [attr.fill]="s.glowColor" [attr.stroke]="s.primaryColor" stroke-width="2.5" />
          <circle cx="120" cy="64" r="17" [attr.fill]="s.primaryColor" opacity="0.7" />
          <circle cx="120" cy="64" r="8" [attr.fill]="s.secondaryColor" />
        }
        @case ('vortex') {
          <!-- Swirling Elemental Tempest -->
          <path d="M84 42 C110 26 154 34 156 58 C158 84 96 86 92 64 C88 48 128 46 132 60" fill="none" [attr.stroke]="s.primaryColor" stroke-width="3" />
          <path d="M74 68 C94 94 158 96 168 68" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" stroke-dasharray="6 4" />
        }
        @case ('chains') {
          <!-- Locking Runic Prism + Crossed Links -->
          <polygon points="120,28 148,66 120,104 92,66" fill="rgb(12 24 44 / 0.85)" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <line x1="68" y1="36" x2="172" y2="96" [attr.stroke]="s.secondaryColor" stroke-width="3.2" stroke-dasharray="10 5" />
          <line x1="172" y1="36" x2="68" y2="96" [attr.stroke]="s.secondaryColor" stroke-width="3.2" stroke-dasharray="10 5" />
        }
        @case ('shield') {
          <!-- Arcane Bastion Aegis Shield -->
          <path d="M86 34 L120 22 L154 34 L148 80 L120 104 L92 80 Z" fill="rgb(10 18 34 / 0.9)" [attr.stroke]="s.primaryColor" stroke-width="2.8" />
          <path d="M98 42 L120 33 L142 42 L138 74 L120 92 L102 74 Z" [attr.fill]="s.glowColor" [attr.stroke]="s.secondaryColor" stroke-width="1.6" />
          <polygon points="120,46 130,62 120,78 110,62" [attr.fill]="s.secondaryColor" opacity="0.8" />
        }
        @case ('blade') {
          <!-- Descending Celestial / Arcanic Blade -->
          <path d="M120 16 L130 78 L120 106 L110 78 Z" fill="rgb(16 22 38 / 0.95)" [attr.stroke]="s.secondaryColor" stroke-width="2.4" />
          <line x1="94" y1="78" x2="146" y2="78" [attr.stroke]="s.primaryColor" stroke-width="3.5" />
          <line x1="120" y1="22" x2="120" y2="94" [attr.stroke]="s.primaryColor" stroke-width="1.6" />
        }
        @case ('eclipse') {
          <!-- Occult Eclipsed Crescent & Hex Halo -->
          <circle cx="120" cy="64" r="28" [attr.fill]="s.primaryColor" opacity="0.28" />
          <circle cx="120" cy="64" r="26" fill="none" [attr.stroke]="s.primaryColor" stroke-width="2.5" />
          <circle cx="128" cy="58" r="22" fill="#090b14" />
          <polygon points="120,26 154,84 86,84" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.4" opacity="0.65" />
        }
        @case ('siphon') {
          <!-- Spectral Claw & Twin Life-Streams -->
          <path d="M84 96 C94 68 106 58 120 50 C134 58 146 68 156 96" fill="none" [attr.stroke]="s.primaryColor" stroke-width="3" />
          <path d="M74 42 C96 48 108 66 120 66 C132 66 144 48 166 42" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.4" stroke-dasharray="5 3" />
          <circle cx="120" cy="64" r="11" fill="#0b0e18" [attr.stroke]="s.secondaryColor" stroke-width="2.2" />
        }
        @default {
          <!-- Runic Star Seal -->
          <polygon points="120,24 152,64 120,104 88,64" fill="rgb(12 18 32 / 0.88)" [attr.stroke]="s.primaryColor" stroke-width="2.4" />
          <circle cx="120" cy="64" r="14" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" />
        }
      }
    </g>

    <!-- 3. Effect Visual Layer ("par rapport a la description") -->
    <g stroke-linecap="round" stroke-linejoin="round" pointer-events="none">
      @switch (s.effect) {
        @case ('SHIELD') {
          <!-- Hexagonal Aegis Barrier Dome -->
          <path d="M58 96 C62 42 94 22 120 22 C146 22 178 42 182 96" fill="none" stroke="#7dd3fc" stroke-width="2.2" opacity="0.72" />
          <path d="M68 96 C72 52 98 34 120 34 C142 34 168 52 172 96" fill="none" stroke="#fef08a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.7" />
        }
        @case ('DAMAGE') {
          <!-- Dynamic Combat Impact Slash + Fracture Rays -->
          <path d="M52 104 Q120 52 192 28" fill="none" stroke="#fb7185" stroke-width="3.6" opacity="0.9" />
          <path d="M64 108 Q126 62 198 38" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="1.8" opacity="0.8" />
          <path d="M168 24 L182 32 M176 20 L174 36" stroke="#fde047" stroke-width="2" />
        }
        @case ('DESTROY') {
          <!-- Cross Shatter Cleave -->
          <line x1="66" y1="24" x2="174" y2="104" stroke="#fb7185" stroke-width="3.2" opacity="0.88" />
          <line x1="174" y1="24" x2="66" y2="104" stroke="#f97316" stroke-width="2.4" opacity="0.8" />
          <circle cx="120" cy="64" r="22" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="4 4" />
        }
        @case ('ATK_BUFF') {
          <!-- Upward War Power Chevrons -->
          <g class="arcane-art-float-slow">
            <path d="M54 88 L66 74 L78 88" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.8" />
            <path d="M54 74 L66 60 L78 74" fill="none" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
            <path d="M162 88 L174 74 L186 88" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2.8" />
            <path d="M162 74 L174 60 L186 74" fill="none" [attr.stroke]="s.primaryColor" stroke-width="2.2" />
          </g>
        }
        @case ('HEAL') {
          <!-- Restorative Floating Orbs & Plus Halo -->
          <g class="arcane-art-float-slow" stroke="#34d399">
            <path d="M56 64 L56 76 M50 70 L62 70" stroke-width="2.6" />
            <path d="M184 52 L184 64 M178 58 L190 58" stroke-width="2.6" />
            <circle cx="64" cy="40" r="3" fill="#34d399" stroke="none" opacity="0.7" />
            <circle cx="176" cy="84" r="3" fill="#fef08a" stroke="none" opacity="0.7" />
          </g>
        }
        @case ('SLOW') {
          <!-- Frosted Runic Bind Bars -->
          <line x1="56" y1="44" x2="184" y2="44" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="8 6" opacity="0.78" />
          <line x1="56" y1="86" x2="184" y2="86" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.78" />
          <polygon points="184,36 196,44 184,52 172,44" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="1.2" />
        }
        @case ('STEALTH') {
          <!-- Spectral Mist Veils -->
          <path d="M40 78 Q88 54 134 72 T208 66" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.45" />
          <path d="M32 92 Q92 70 144 86 T216 80" fill="none" stroke="#94a3b8" stroke-width="2.5" opacity="0.38" />
        }
        @case ('ENERGY') {
          <!-- Lightning Conduit Bolt -->
          <polygon points="178,24 164,52 176,52 162,82 190,46 177,46" fill="#f0c96e" stroke="#fef08a" stroke-width="1.2" />
          <path d="M64 46 L76 58 L62 66" fill="none" stroke="#34d399" stroke-width="2.2" />
        }
        @case ('PEEK') {
          <!-- Scrying Sight Rays -->
          <ellipse cx="182" cy="42" rx="14" ry="8" fill="#080c17" stroke="#7dd3fc" stroke-width="1.8" />
          <circle cx="182" cy="42" r="3.5" fill="#fde047" />
          <line x1="168" y1="42" x2="128" y2="62" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.7" />
        }
        @case ('REACTIVE') {
          <!-- Counter-Sigil Guard Ring -->
          <circle cx="120" cy="64" r="46" fill="none" stroke="#f0c96e" stroke-width="1.8" stroke-dasharray="8 5" opacity="0.75" />
          <polygon points="120,16 125,26 115,26" fill="#f0c96e" />
          <polygon points="120,112 125,102 115,102" fill="#f0c96e" />
        }
        @case ('CURSE') {
          <!-- Hex Ring & Downward Affliction -->
          <circle cx="120" cy="64" r="44" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="10 4 3 4" opacity="0.75" />
          <path d="M58 38 L58 60 M52 54 L58 62 L64 54" fill="none" stroke="#fb7185" stroke-width="2.2" />
          <path d="M182 38 L182 60 M176 54 L182 62 L188 54" fill="none" stroke="#fb7185" stroke-width="2.2" />
        }
        @case ('SURVOL') {
          <!-- High-Altitude Flight Wind Sweeps -->
          <path d="M36 44 Q98 18 164 30" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" stroke-dasharray="12 5" opacity="0.75" />
          <path d="M52 34 L68 28 L60 40" fill="none" [attr.stroke]="s.secondaryColor" stroke-width="2" opacity="0.8" />
        }
      }
    </g>
  </svg>

  <!-- Concise Effect Readout Badge matching card description (hidden in mini compact thumbnail mode) -->
  @if (!compact()) {
    <span class="arcane-art-effect-chip">
      {{ s.effectTag }}
    </span>
  }
</div>
