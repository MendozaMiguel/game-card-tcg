<div class="app-shell flex min-h-dvh flex-col text-arcane-ink">
  @if (auth.isAuthenticated()) {
    <app-header />
  }

  <router-outlet />

  <!-- Régions live centralisées (accessibilité) -->
  <div class="visually-hidden" aria-live="polite" aria-atomic="true">
    {{ announcer.politeAnnouncement() }}
  </div>
  <div class="visually-hidden" aria-live="assertive" aria-atomic="true">
    {{ announcer.assertiveAnnouncement() }}
  </div>

  <!-- Pile de notifications visuelles -->
  @if (announcer.toasts().length > 0) {
    <aside aria-label="Notifications" class="fixed inset-x-3 bottom-[max(0.75rem,env(safe-area-inset-bottom))] z-50 flex flex-col gap-2 sm:inset-x-auto sm:right-4 sm:bottom-4 sm:w-full sm:max-w-sm">
      @for (toast of announcer.toasts(); track toast.id) {
        <div
          class="flex items-start justify-between gap-3 rounded-xl border px-3.5 py-2.5 text-xs shadow-xl backdrop-blur-md"
          [class]="toast.kind === 'error' ? 'border-rose-500/60 bg-rose-950/90 text-rose-100' : toast.kind === 'success' ? 'border-emerald-500/60 bg-emerald-950/90 text-emerald-100' : 'border-amber-400/50 bg-slate-900/95 text-slate-100'">
          <span>{{ toast.message }}</span>
          <button
            type="button"
            (click)="announcer.dismissToast(toast.id)"
            aria-label="Fermer la notification"
            class="arcane-btn inline-flex h-7 w-7 min-h-7! shrink-0 items-center justify-center rounded-lg border border-white/10 bg-black/25 text-current opacity-85 hover:opacity-100">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
    </aside>
  }
</div>
